name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bakatavern/web build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

  binaries:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, tool: zigbuild }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, tool: zigbuild }
          # Termux on Android phones.
          - { target: aarch64-linux-android, os: ubuntu-latest, tool: ndk }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, tool: cargo }
          - { target: aarch64-apple-darwin, os: macos-latest, tool: cargo }
          - { target: x86_64-apple-darwin, os: macos-latest, tool: cargo }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build (zig)
        if: matrix.tool == 'zigbuild'
        run: |
          pip install ziglang
          cargo install cargo-zigbuild --locked
          cargo zigbuild --release --locked -p bt-cli --target ${{ matrix.target }}
      - name: Build (Android NDK)
        if: matrix.tool == 'ndk'
        run: |
          cargo install cargo-ndk --locked
          cargo ndk --platform 24 --target ${{ matrix.target }} build --release --locked -p bt-cli
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
      - name: Build
        if: matrix.tool == 'cargo'
        run: cargo build --release --locked -p bt-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="bakatavern-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp LICENSE README.md README.zh-CN.md "$name/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/bakatavern.exe" "$name/"
            7z a "$name.zip" "$name" >/dev/null
          else
            cp "target/${{ matrix.target }}/release/bakatavern" "$name/"
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: bakatavern-*.*

  release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          merge-multiple: true
      - run: sha256sum bakatavern-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            bakatavern-*
            SHA256SUMS

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
